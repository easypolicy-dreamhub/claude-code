tself, effectively pass assets physically located in another country \u2014 see "Foreign assets" below. A will only works if it can be found: keep the original where the executor can reach it and tell them where. Do not keep the only original in a bank safe deposit box \u2014 the bank seals the box on death, and probate needs the original will.'},{id:"executor",group:"Core documents",title:t?"Executor / wasi named, with a back-up":"Executor named, with a back-up",why:"Someone willing and able to administer the estate, or a professional / trust company. Confirm they know they were chosen. If a sole executor dies after probate is granted, their own executor takes over \u2014 someone the deceased never chose \u2014 so name a back-up or consider a corporate executor."},{id:"guardian",group:"Core documents",title:"Guardian for minor children",why:"Name a guardian in the will (Guardianship of Infants Act 1961) and consider a trust to hold assets for minors, who cannot give a valid receipt. Without a named guardian the court decides, which is slow. The guardian cares for the child but does not control trust-nominated insurance money: that is held by the surviving parent, or by Amanah Raya if both parents have died. Mark N/A if there are no minor children."},{id:"insurance",group:"Beneficiary designations",title:t?"Takaful / life insurance nominations":"Life insurance nominations",why:'Nominations sit outside the will. Under the Financial Services Act 2013, Schedule 10, a nominated spouse, child or parent (a parent only if there is no living spouse or child) holds the money on an automatic trust: it bypasses the estate, cannot be overridden by the will and is safe from creditors. Any other nominee (a sibling, friend, partner who is not a spouse) receives the money as executor for the estate, not for themselves \u2014 unless the policy owner assigns the benefits to them in writing. If one of several nominees dies first the survivors share the whole sum; if all die first it falls into the estate. Trust status is fixed on the day of nomination: a parent nominated before marriage stays a trust nominee, but a parent nominated after marriage, or a fianc\xE9(e) nominated before it, only holds the money for the estate \u2014 so renominate after marrying. A minor child\u2019s share is paid to the surviving parent as statutory trustee, or to Amanah Raya if no parent survives. The insurer pays according to the latest valid nomination, so review it after a marriage, divorce, birth or death. If a policy was bought in Singapore while working there, mark it "Held outside Malaysia" in the Assets tab \u2014 Singapore\u2019s Insurance Act treats a trust nomination differently (valid only for a spouse or children) from a Malaysian one.'},{id:"retirement",group:"Beneficiary designations",title:"EPF nomination",why:`EPF savings pass to the nominees on record under the EPF Act, not by the will. If a nominee dies first their share goes into the estate, and if every nominee dies first the whole balance does \u2014 so review the nomination after any death in the family.${t?" For Muslims, confirm how nominees hold the funds relative to faraid.":""} Unlike CPF in Singapore, an EPF nomination is not automatically cancelled by marriage or divorce \u2014 members must update it themselves. Review after marriage, birth or divorce. If they also have Singapore CPF savings from working there, record it as a separate asset and mark it "Held outside Malaysia" \u2014 CPF follows different rules (marriage automatically revokes a CPF nomination; EPF does not).`},{id:"joint",group:"Beneficiary designations",title:"Jointly-owned assets reviewed",why:"The deceased\u2019s share of a joint account or property (for example 1/3 where there are three holders) generally forms part of the estate and needs the grant to release it \u2014 joint accounts are not freely usable estate cash, and surviving holders should not withdraw the money. Only where the title or account mandate expressly gives survivorship does the share pass straight to the survivor. Check how each one is held."},{id:"living_trust",group:"Trusts and structures",title:"Living (inter vivos) trust",why:"Holds assets during life and after death. Can avoid probate delay, add conditions, and protect minors or vulnerable beneficiaries."},{id:"testamentary_trust",group:"Trusts and structures",title:"Testamentary trust (created by the will)",why:"A trust set out inside the will itself, which only comes into being on death \u2014 unlike a living trust, nothing needs to be transferred or funded, and there are no lifetime trustee fees. Commonly used to hold a minor child's or dependant's inheritance and release it in stages (for example at 21, 25 and 30) instead of all at once. Mark N/A if not applicable."},{id:"business_trust",group:"Trusts and structures",title:"Business trust / holding structure for succession",why:"A trust or holding company that owns the business interests, so ownership and control pass as intended instead of being split among heirs. Mark N/A if there is no business."},{id:"business_agreement",group:"Trusts and structures",title:"Shareholder / partnership agreement and key-person cover",why:"Buy-sell terms, who steps in, and funding for a buy-out. A partnership is dissolved on a partner\u2019s death unless the agreement says otherwise. Mark N/A if there is no business."},{id:"holding_company",group:"Trusts and structures",title:"Investment holding company reviewed",why:"A private company (Sdn Bhd) that owns the properties or investments, so only its shares pass on death instead of each asset. This avoids a separate transfer (and roughly 1% in fees) for every property and keeps heirs out of fractional co-ownership of land titles. The company can keep collecting rent and paying loans during probate \u2014 but only if another director can act, so appoint a second director and make sure the constitution says what happens to a shareholder\u2019s shares on death (pre-emption
